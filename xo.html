<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إكس أو | بدر × شمس</title>
<style>
body{margin:0;background:radial-gradient(circle at 50% 0,#142747,#07101d 65%);color:#fff;font-family:Arial,Tahoma,sans-serif;text-align:center}
.wrap{max-width:650px;margin:auto;padding:22px}
.card{background:#101d31;border:1px solid #2b4165;border-radius:22px;padding:20px}
.status{padding:12px;border-radius:12px;background:#ffffff09;margin:12px 0}
.board{display:grid;grid-template-columns:repeat(3,minmax(70px,110px));gap:8px;justify-content:center;margin:22px auto}
.cell{aspect-ratio:1;background:#172944;border:1px solid #31486c;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:46px;cursor:pointer}
.cell:hover{background:#203657}.x{color:#7ec8ff}.o{color:#ffd66b}
button{border:0;border-radius:12px;padding:11px 16px;background:#28446b;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>❌⭕ إكس أو</h1>
<div id="status" class="status">جاري التحميل...</div>
<div id="board" class="board"></div>
<button onclick="reset()">🔄 إعادة الجولة</button>
</div></div>
<script>
let board=["","","","","","","","",""];
let localPlayer=null;
let state=null;

function api(){return window.parent.Space}

function receive(){
  try{
    state=api().getState();
    localPlayer=api().getPlayer();
    board=state?.gamesData?.xo?.board || board;
    render();
  }catch(e){document.getElementById("status").textContent="تعذر الاتصال بالنظام الأساسي."}
}
function render(){
  const turn=state?.turn;
  document.getElementById("status").textContent=
    turn===localPlayer?"🎯 دورك الآن":"⏳ انتظر دور الطرف الآخر";
  document.getElementById("board").innerHTML=board.map((v,i)=>{
    const mark=v==="hammam"?"X":v==="monia"?"O":"";
    return `<div class="cell ${mark.toLowerCase()}" onclick="move(${i})">${mark}</div>`;
  }).join("");
}
function winner(b){
 const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 for(const [a,c,d] of lines)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];
 return null;
}
async function move(i){
 if(!state||state.turn!==localPlayer||board[i])return;
 board[i]=localPlayer;
 const w=winner(board);
 const u={"gamesData/xo/board":board};
 if(w){
   u["scores/"+localPlayer]=(state.scores?.[localPlayer]||0)+3;
   u["stats/games"]=(state.stats?.games||0)+1;
   u["stats/wins/"+localPlayer]=(state.stats?.wins?.[localPlayer]||0)+1;
   u.turn=localPlayer==="hammam"?"monia":"hammam";
   await api().update(u);
   alert("🏆 فوز! +3 نقاط");
   return;
 }
 if(board.every(Boolean)){
   u.turn=localPlayer==="hammam"?"monia":"hammam";
   await api().update(u);
   alert("تعادل!");
   return;
 }
 u.turn=localPlayer==="hammam"?"monia":"hammam";
 await api().update(u);
}
async function reset(){
 board=["","","","","","","","",""];
 await api().update({"gamesData/xo/board":board,turn:"hammam"});
}
window.addEventListener("load",()=>{
  const timer=setInterval(()=>{
    if(window.parent.Space){clearInterval(timer);receive();}
  },100);
});
setInterval(receive,500);
</script>
</body>
</html>
