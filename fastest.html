<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>اختبار الاتصال</title>
</head>
<body style="background:#040711;color:#fff;text-align:center;padding:50px;font-family:sans-serif">
<h2>اختبار اتصال Supabase</h2>
<button onclick="test()" style="padding:15px 30px;font-size:18px;background:#1e67ba;color:#fff;border:none;border-radius:10px;cursor:pointer">اضغط لاختبار الإنشاء</button>
<p id="res" style="margin-top:20px;font-weight:bold"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(
  "https://vslatdxtvfjeftoljxc.supabase.co",
  "sb_publishable_bxZkAQifpNf7yHYo_HuM-w_fUafg_Y2"
);

async function test() {
  document.getElementById("res").textContent = "جاري الإرسال...";
  const { data, error } = await sb.from("game_rooms").insert([
    { code: "999999", host_id: "1250493517", game: "fastest", status: "waiting" }
  ]).select();

  if (error) {
    document.getElementById("res").style.color = "#ff4b65";
    document.getElementById("res").textContent = "خطأ: " + error.message;
  } else {
    document.getElementById("res").style.color = "#65df92";
    document.getElementById("res").textContent = "تم بنجاح! الاتصال شغال 100%";
  }
}
</script>
</body>
</html>
