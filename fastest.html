<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الأسرع — بدر × شمس</title>
<style>
body{background:#040711;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
.btn{background:#1e67ba;color:#fff;border:none;padding:15px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer;font-weight:bold}
.error{color:#ff4b65;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<h1>⚡ الأسرع</h1>
<div id="status">جاري التحقق...</div>
<button class="btn" onclick="createRoom()">إنشاء غرفة جديدة 🎮</button>
<div id="errorMessage" class="error"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// الرابط والمفتاح القابل للنشر الصحيحين
const SUPABASE_URL = "https://vslatdxtvfjeftoljxc.supabase.co";
const SUPABASE_KEY = "sb_publishable_bxZkAQifpNf7yHYo_HuM-w_fUafg_Y2";

const urlParams = new URLSearchParams(window.location.search);
const meId = urlParams.get("user_id") || "1250493517";

document.getElementById("status").textContent = "أنت تلعب كـ: " + meId;

async function createRoom() {
    document.getElementById("errorMessage").textContent = "جاري الإنشاء...";
    try {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        
        const response = await fetch(`${SUPABASE_URL}/rest/v1/game_rooms`, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            },
            body: JSON.stringify({
                code: code,
                host_id: meId,
                game: "fastest",
                status: "waiting"
            })
        });

        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.message || 'خطأ في الاستجابة');
        }

        alert("تم إنشاء الغرفة بنجاح! الكود: " + code);
        document.getElementById("errorMessage").textContent = "";
    } catch (e) {
        document.getElementById("errorMessage").textContent = "خطأ: " + e.message;
        console.error(e);
    }
}
</script>
</body>
</html>
