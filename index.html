<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحة بدر وشمس 🌌</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: white; text-align: center; margin: 0; padding: 15px; }
        .hidden { display: none; }
        .btn { padding: 12px 20px; margin: 8px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-bader { background-color: #0f3460; color: white; }
        .btn-shams { background-color: #e94560; color: white; }
        .btn:hover { opacity: 0.85; transform: scale(1.03); }
        
        #scoreboard { display: flex; justify-content: space-around; background: #0f3460; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        #turn-indicator { font-size: 18px; margin: 10px 0; padding: 10px; border-radius: 8px; font-weight: bold; }
        
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .game-card { background: #16213e; padding: 15px; border-radius: 12px; cursor: pointer; border: 2px solid #0f3460; transition: 0.2s; }
        .game-card:hover { border-color: #e94560; }
        
        .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 5px; justify-content: center; margin-top: 15px; }
        .cell { width: 90px; height: 90px; background-color: #16213e; font-size: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; }
        
        .disabled { pointer-events: none; opacity: 0.5; }
        input, textarea { width: 90%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; background: #16213e; color: white; font-size: 16px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <h1 style="color: #e94560;">مساحة بدر وشمس 🌌</h1>
        <p style="font-size: 18px;">من أنت يا صديقي؟</p>
        <button class="btn btn-bader" onclick="login('hammam')">بدر (همام) 👨🏻</button>
        <button class="btn btn-shams" onclick="login('monia')">شمس (منية) 👩🏻</button>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="main-screen" class="hidden">
        <div id="scoreboard">
            <div>👨🏻 نقاط بدر: <span id="score-hammam">0</span></div>
            <div>👩🏻 نقاط شمس: <span id="score-monia">0</span></div>
        </div>
        
        <div id="turn-indicator">جارِ الاتصال...</div>

        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;">
            <button class="btn" style="background:#4caf50; color:white;" onclick="showScreen('menu-screen')">🏠 الألعاب</button>
            <button class="btn" style="background:#ff9800; color:white;" onclick="showScreen('settings-screen')">⚙️ الإعدادات</button>
        </div>

        <!-- شاشة قائمة الألعاب -->
        <div id="menu-screen">
            <h3>اختر لعبة للبدء التفاعلي 🎮</h3>
            <div class="games-grid">
                <div class="game-card" onclick="openGame('xo')">❌ إكس أو (XO)</div>
                <div class="game-card" onclick="openGame('truth')">💬 أسئلة صراحة</div>
                <div class="game-card" onclick="openGame('challenge')">🔥 تحدي السريعة</div>
                <div class="game-card" onclick="openGame('memory')">🧠 من يعرف الثاني أكثر</div>
            </div>
        </div>

        <!-- ساحة عرض الألعاب الفردية -->
        <div id="game-container" class="hidden">
            <button class="btn" style="background:#666; color:white; margin-bottom:10px;" onclick="showScreen('menu-screen')">⬅️ عودة للقائمة</button>
            <div id="active-game-content"></div>
        </div>

        <!-- شاشة الإعدادات وإضافة محتوى جديد -->
        <div id="settings-screen" class="hidden">
            <h3>إعدادات المساحة وإضافة الأسئلة ⚙️</h3>
            <p>أضف سؤالاً أو تحدياً جديداً ليظهر عند الطرف الآخر:</p>
            <textarea id="custom-question" placeholder="اكتب السؤال أو التحدي هنا..."></textarea>
            <button class="btn btn-bader" onclick="addCustomContent()">إضافة للمساحة 🚀</button>
            <div id="custom-list" style="margin-top: 15px; text-align: right;"></div>
        </div>
    </div>

    <!-- جافاسكريبت و Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCh5eqP5A6c0K_-KtlwNAPR_vYFXYHxm4",
            authDomain: "space-4e22f.firebaseapp.com",
            projectId: "space-4e22f",
            storageBucket: "space-4e22f.firebasestorage.app",
            messagingSenderId: "804457119217",
            appId: "1:804457119217:web:99a62f5ef4ebfed8afd850",
            measurementId: "G-R2YRH0EX9L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentPlayer = "";
        let globalData = null;

        window.login = function(player) {
            currentPlayer = player;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            syncData();
        }

        function syncData() {
            onValue(ref(db, 'spaceData'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    globalData = data;
                    updateUI();
                } else {
                    set(ref(db, 'spaceData'), {
                        turn: 'hammam',
                        scores: { hammam: 0, monia: 0 },
                        currentGame: 'menu',
                        xo: { board: ["","","","","","","","",""] },
                        currentQuestion: "ما هو أكثر شيء تفضله في الطرف الآخر؟",
                        customs: {}
                    });
                }
            });
        }

        function updateUI() {
            if (!globalData) return;
            document.getElementById('score-hammam').innerText = globalData.scores.hammam;
            document.getElementById('score-monia').innerText = globalData.scores.monia;

            const turnEl = document.getElementById('turn-indicator');
            if (globalData.turn === currentPlayer) {
                turnEl.innerText = "دورك الآن للعب والتفاعل! 🤩";
                turnEl.style.background = "rgba(76, 175, 80, 0.2)";
                turnEl.style.color = "#4caf50";
            } else {
                let other = globalData.turn === 'hammam' ? 'بدر' : 'شمس';
                turnEl.innerText = `انتظر، دور ${other} الآن... ⏳`;
                turnEl.style.background = "rgba(233, 69, 96, 0.2)";
                turnEl.style.color = "#e94560";
            }

            // عرض المحتوى المخصص في الإعدادات
            let customsDiv = document.getElementById('custom-list');
            customsDiv.innerHTML = "<h4>الأسئلة المضافة حديثاً:</h4>";
            if (globalData.customs) {
                Object.values(globalData.customs).forEach(q => {
                    customsDiv.innerHTML += `<div style="background:#16213e; padding:8px; margin:5px 0; border-radius:6px;">📌 ${q}</div>`;
                });
            }
        }

        window.showScreen = function(screenId) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
            
            if(screenId !== 'game-container') {
                update(ref(db, 'spaceData'), { currentGame: screenId });
            }
        }

        window.openGame = function(gameType) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            renderActiveGame(gameType);
        }

        function renderActiveGame(type) {
            const container = document.getElementById('active-game-content');
            if (type === 'xo') {
                container.innerHTML = `<h3>لعبة إكس أو (XO)</h3><div class="board" id="xo-board"></div>`;
                drawXOBoard();
            } else if (type === 'truth') {
                container.innerHTML = `<h3>سؤال صراحة 💬</h3><p style="font-size:20px; background:#16213e; padding:20px; border-radius:10px;">${globalData.currentQuestion || "لا يوجد سؤال حالياً"}</p><button class="btn btn-shams" onclick="changeQuestion()">سؤال جديد 🔀</button>`;
            } else if (type === 'challenge') {
                container.innerHTML = `<h3>تحدي السريعة 🔥</h3><p style="font-size:18px;">أسرع شخص يضغط الزر يكسب نقطة!</p><button class="btn btn-bader" onclick="winPoint()">أنا سبقت وضغطت! ⚡</button>`;
            } else if (type === 'memory') {
                container.innerHTML = `<h3>من يعرف الثاني أكثر؟ 🧠</h3><p style="font-size:18px;">اكتب توقعك عن إجابة الطرف الآخر في قسم الإعدادات!</p>`;
            }
        }

        function drawXOBoard() {
            const boardDiv = document.getElementById('xo-board');
            if(!boardDiv) return;
            boardDiv.innerHTML = "";
            let board = globalData.xo.board;
            
            board.forEach((cell, index) => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.innerText = cell === 'hammam' ? 'X' : (cell === 'monia' ? 'O' : '');
                div.style.color = cell === 'hammam' ? '#0f3460' : '#e94560';
                
                div.onclick = () => {
                    if (globalData.turn !== currentPlayer || board[index] !== "") return;
                    board[index] = currentPlayer;
                    let next = globalData.turn === 'hammam' ? 'monia' : 'hammam';
                    update(ref(db, 'spaceData'), { 'xo/board': board, turn: next });
                    drawXOBoard();
                };
                boardDiv.appendChild(div);
            });
        }

        window.winPoint = function() {
            if (globalData.turn !== currentPlayer) return;
            let currentPoints = globalData.scores[currentPlayer];
            let updates = {};
            updates[`scores/${currentPlayer}`] = currentPoints + 1;
            updates['turn'] = currentPlayer === 'hammam' ? 'monia' : 'hammam';
            update(ref(db, 'spaceData'), updates);
            alert("مبروك، كسبت نقطة!");
        }

        window.addCustomContent = function() {
            let val = document.getElementById('custom-question').value;
            if(!val) return;
            push(ref(db, 'spaceData/customs'), val);
            document.getElementById('custom-question').value = "";
            alert("تمت الإضافة بنجاح!");
        }
    </script>
</body>
</html>
