<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18"><title>بدر × شمس</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#182b55,#090f21 45%,#040711);color:#fff}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden}.stars{position:fixed;inset:0;opacity:.7;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,.45) 1px,transparent 1px);background-size:80px 80px,130px 130px}.card{width:min(470px,100%);padding:30px 20px 22px;border:1px solid #ffffff14;border-radius:28px;background:linear-gradient(145deg,#141f3cf2,#070b19f5);box-shadow:0 35px 100px #0008;backdrop-filter:blur(18px);position:relative;z-index:1}.brand{text-align:center}.icons{font-size:52px}.brand h1{margin:8px 0 5px;font-size:32px}.brand h1 span{color:#8995ab}.brand p{margin:0;color:#8490a6;font-size:13px}.label{text-align:center;color:#9ba7bc;font-size:13px;margin:30px 0 13px}.choices{display:grid;gap:11px}.choice{border:1px solid #ffffff12;border-radius:17px;padding:15px;background:#ffffff08;color:white;display:flex;align-items:center;gap:13px;text-align:right}.choice:hover{border-color:#75b9ff66}.ci{width:47px;height:47px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}.moon{color:#78bdff;background:#2878dc22}.sun{color:#ffad4d;background:#ff8c2820}.info{flex:1}.info strong,.info span{display:block}.info span{font-size:11px;color:#78869b;margin-top:3px}.arrow{color:#748198;font-size:20px}.back{border:0;background:none;color:#8491a6;margin-bottom:20px}.selected{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}.selected strong,.selected span{display:block}.selected span{font-size:11px;color:#7c899d;margin-top:3px}.pass{display:flex;border:1px solid #ffffff16;border-radius:14px;overflow:hidden;background:#ffffff08}.pass input{flex:1;border:0;outline:0;background:transparent;color:white;padding:14px;direction:ltr;font-size:18px}.pass button{width:52px;border:0;background:transparent;color:#8b97aa}.error{height:25px;color:#ff6477;text-align:center;font-size:12px;padding-top:7px}.enter{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#1e67ba,#3286df);color:white;font-weight:800}.foot{text-align:center;color:#5d6a80;font-size:10px;margin-top:24px}
.app{min-height:100vh;padding-bottom:80px}.header{height:72px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:#050914dd;border-bottom:1px solid #ffffff0d;position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}.who{display:flex;align-items:center;gap:8px}.who i{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-style:normal;background:#4b9cff18;color:#7cc0ff;font-size:22px}.who small,.who b{display:block}.who small{font-size:9px;color:#68758a}.who b{font-size:13px}.headtitle{text-align:center;font-size:14px;font-weight:800}.headtitle span{color:#6e7b91}.headtitle small{display:block;color:#55db83;font-size:8px;margin-top:3px}.logout{border:0;background:none;color:#8a96a9;font-size:24px}.score{width:min(720px,calc(100% - 28px));margin:16px auto;padding:12px 16px;border:1px solid #ffffff0d;border-radius:18px;background:#ffffff08;display:flex;justify-content:space-between;align-items:center}.side{display:flex;align-items:center;gap:8px}.avatar{width:37px;height:37px;border-radius:11px;display:flex;align-items:center;justify-content:center}.data span,.data b{display:block}.data span{font-size:9px;color:#69768b}.data b{font-size:18px}.vs{text-align:center;color:#77849a;font-size:9px}.home{width:min(720px,calc(100% - 28px));margin:16px auto}.welcome{padding:23px;border-radius:23px;border:1px solid #ffffff0d;background:linear-gradient(135deg,#143664,#0a132a);min-height:180px}.welcome small{color:#75b9ff}.welcome h2{font-size:27px;margin:10px 0 6px}.welcome p{margin:0;color:#8c99ad;font-size:12px;line-height:1.7}.action{margin-top:12px;width:100%;padding:18px;border:1px solid #75b9ff30;border-radius:18px;background:linear-gradient(135deg,#1f67be55,#ff8c2810);color:#fff;text-align:right;display:flex;align-items:center;gap:12px}.action .big{font-size:30px}.action strong,.action span{display:block}.action span{color:#718097;font-size:10px;margin-top:4px}.tile{margin-top:18px;padding:16px;border-radius:20px;border:1px solid #ffffff0d;background:#ffffff08;cursor:pointer}.tile .art{text-align:center;font-size:55px;margin:10px}.tile h3{margin:5px 0}.tile p{margin:0;color:#68758a;font-size:10px}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(600px,calc(100% - 24px));padding:6px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #ffffff12;border-radius:19px;background:#070c19ed;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#627087;border-radius:13px;padding:7px}.nav button.active{color:#79bbff;background:#3c8cff18}.nav span,.nav small{display:block}.nav small{font-size:8px;margin-top:2px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal>div{width:min(390px,100%);padding:25px;border-radius:23px;text-align:center;background:#111d36;border:1px solid #ffffff12}.modal p{color:#7f8ca0;font-size:12px;line-height:1.7}
</style></head>
<body>
<div id="login" class="login"><div class="stars"></div><main class="card">
<div class="brand"><div class="icons">☾ × ☀</div><h1>بدر <span>×</span> شمس</h1><p>مساحة اللعب والتحديات</p></div>
<section id="choose"><div class="label">من أنت؟</div><div class="choices">
<button class="choice" onclick="selectPlayer('hammam')"><div class="ci moon">☾</div><div class="info"><strong>بدر</strong><span>همام</span></div><div class="arrow">←</div></button>
<button class="choice" onclick="selectPlayer('monia')"><div class="ci sun">☀</div><div class="info"><strong>شمس</strong><span>منية</span></div><div class="arrow">←</div></button>
</div></section>
<section id="password" class="hidden"><button class="back" onclick="back()">→ تغيير الشخص</button><div id="selected" class="selected"></div><label style="display:block;color:#9aa6b9;font-size:12px;margin-bottom:7px">كلمة الدخول</label><div class="pass"><input id="pw" type="password" maxlength="20" placeholder="••••"><button onclick="eye()">👁</button></div><div id="err" class="error"></div><button class="enter" onclick="enter()">دخول المساحة <span style="float:left">→</span></button></section>
<div class="foot">🌙 البدر • ☀️ الشمس</div>
</main></div>
<div id="app" class="app hidden">
<header class="header"><div class="who"><i id="hi">☾</i><div><small>أنت</small><b id="hn">بدر</b></div></div><div class="headtitle">بدر <span>×</span> شمس<small>● المساحة جاهزة</small></div><button class="logout" onclick="logout()">⋮</button></header>
<section class="score"><div class="side"><div class="avatar moon">☾</div><div class="data"><span>بدر</span><b id="bs">0</b></div></div><div class="vs">النقاط<br>VS</div><div class="side"><div class="data"><span>شمس</span><b id="ss">0</b></div><div class="avatar sun">☀</div></div></section>
<main class="home"><section class="welcome"><small>أهلاً بك ✦</small><h2 id="wt">جاهز للتحدي؟</h2><p id="wp">اليوم نبي نشوف من فيكم المتصدر.</p></section>
<button class="action" onclick="openFastest()"><div class="big">⚡</div><div><strong>الأسرع يفوز</strong><span>تحدي مباشر بين هاتفين مختلفين</span></div><b>←</b></button>
<article class="tile" onclick="openFastest"><div class="art">⚡</div><h3>الأسرع يفوز</h3><p>5 جولات • ردّة فعل • الفائز يحصل على 3 نقاط</p></article>
<nav class="nav"><button class="active"><span>🏠</span><small>الرئيسية</small></button><button onclick="openFastest()"><span>⚡</span><small>الأسرع</small></button><button onclick="modal('الأسئلة قادمة قريبًا.','❓')"><span>❓</span><small>الأسئلة</small></button><button onclick="modal('نتيجة كل مباراة تظهر في نهاية اللعبة.','🏆')"><span>🏆</span><small>النتائج</small></button></nav></main></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div><div id="mi" style="font-size:38px">✦</div><h2>تنبيه</h2><p id="mt"></p><button class="enter" onclick="closeModal()">تمام</button></div></div>
<script>
const C={passwords:{hammam:"1234",monia:"5678"},players:{hammam:{name:"بدر",real:"همام",icon:"☾"},monia:{name:"شمس",real:"منية",icon:"☀"}}};let selected=null,current=null;
const $=id=>document.getElementById(id);
function selectPlayer(p){selected=p;$("choose").classList.add("hidden");$("password").classList.remove("hidden");let x=C.players[p];$("selected").innerHTML='<div class="ci '+(p==="hammam"?"moon":"sun")+'">'+x.icon+'</div><div><strong>'+x.name+'</strong><span>'+x.real+'</span></div>';setTimeout(()=>$("pw").focus(),100)}
function back(){selected=null;$("password").classList.add("hidden");$("choose").classList.remove("hidden");$("pw").value=""}
function eye(){let i=$("pw");i.type=i.type==="password"?"text":"password"}
function enter(){if(!selected)return;$("err").textContent="";if($("pw").value!==C.passwords[selected]){$("err").textContent="كلمة الدخول غير صحيحة ❌";return}current=selected;sessionStorage.setItem("badrShamsPlayer",current);showApp()}
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");let x=C.players[current];$("hi").textContent=x.icon;$("hn").textContent=x.name;$("wt").textContent=current==="hammam"?"يا هلا يا بدر 🌙":"يا هلا يا شمس ☀️";$("wp").textContent=current==="hammam"?"جاهز تشوف هل تقدر تتفوق على شمس اليوم؟":"جاهزة تشوفي هل تقدري تتفوقي على بدر اليوم؟";scores()}
function scores(){let s;try{s=JSON.parse(localStorage.getItem("badrShamsScores")||'{"hammam":0,"monia":0}')}catch(e){s={hammam:0,monia:0}}$("bs").textContent=s.hammam||0;$("ss").textContent=s.monia||0}
function openFastest(){location.href="games/fastest.html"}
function modal(t,i){$("mt").textContent=t;$("mi").textContent=i||"✦";$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden")}
function logout(){sessionStorage.removeItem("badrShamsPlayer");location.reload()}
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
addEventListener("DOMContentLoaded",()=>{let p=sessionStorage.getItem("badrShamsPlayer");if(p==="hammam"||p==="monia"){current=p;showApp()}})
</script></body></html>
