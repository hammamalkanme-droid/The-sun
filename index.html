<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بدر × شمس | المساحة</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="app-shell">

<section id="login" class="card login">
  <div class="brand">
    <div class="symbols">🌙 ✦ ☀️</div>
    <h1>بدر × شمس</h1>
    <p>مساحة اللعب والتحديات والذكريات المشتركة</p>
  </div>
  <div class="login-buttons">
    <button class="btn moon" onclick="loginAs('hammam')">🌙 دخول بدر<br><small>همام</small></button>
    <button class="btn sun" onclick="loginAs('monia')">☀️ دخول شمس<br><small>منية</small></button>
  </div>
</section>

<main id="app" class="hidden">
  <section class="card">
    <div class="topbar">
      <div class="player">
        <div class="name"><span id="playerName"></span></div>
        <small id="playerRole"></small>
      </div>
      <div class="scores">
        <div class="score">🌙 بدر<b id="bScore">0</b></div>
        <div class="score sun-score">☀️ شمس<b id="sScore">0</b></div>
      </div>
      <div style="text-align:left"><button class="btn" onclick="goHome()">الرئيسية</button></div>
    </div>
    <div id="turn" class="turn">جارٍ الاتصال...</div>
    <div class="nav">
      <button class="btn moon" onclick="openGame('games/xo.html','إكس أو')">❌⭕ إكس أو</button>
      <button class="btn" onclick="alert('القائمة الكاملة للألعاب ستضاف هنا ككتالوج مستقل.')">🎮 الألعاب</button>
      <button class="btn" onclick="alert('الفعاليات ستضاف هنا ككتالوج مستقل.')">🎯 الفعاليات</button>
      <button class="btn" onclick="alert('الأسئلة ستضاف هنا في وحدة مستقلة.')">❓ الأسئلة</button>
    </div>
  </section>

  <section id="homePanel" class="hero">
    <div class="card hero-main">
      <div style="font-size:42px">🌙 ✦ ☀️</div>
      <h2>مساحتكم الخاصة</h2>
      <p>
        هذا هو القلب الرئيسي للمشروع. من هنا سنضيف الألعاب والفعاليات
        كملفات مستقلة، بحيث تقدر تضيف لعبة جديدة بدون لمس نظام الموقع الأساسي.
      </p>
      <button class="btn moon" onclick="openGame('games/xo.html','إكس أو')">ابدأ أول لعبة →</button>
    </div>
    <div class="card">
      <h3>مركز سريع</h3>
      <div class="quick-grid">
        <div class="quick" onclick="openGame('games/xo.html','إكس أو')">❌⭕<br><b>إكس أو</b></div>
        <div class="quick">🎯<br><b>فعاليات</b></div>
        <div class="quick">❓<br><b>أسئلة</b></div>
        <div class="quick">🏆<br><b>النتائج</b></div>
      </div>
    </div>
  </section>

  <section id="gamePanel" class="card hidden" style="margin-top:14px">
    <div class="game-head">
      <button class="btn" onclick="goHome()">← رجوع</button>
      <h2 id="gameTitle" style="margin:0"></h2>
    </div>
    <iframe id="gameFrame" title="محتوى بدر وشمس"></iframe>
  </section>
</main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
