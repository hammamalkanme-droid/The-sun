<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050916">
<title>إكس أو | بدر × شمس</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#1b315e,#091126 42%,#040711);color:#fff}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer}button:active{transform:scale(.97)}.hidden{display:none!important}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.22}
.moon-orb{width:240px;height:240px;right:-80px;top:80px;background:#237ee8}
.sun-orb{width:220px;height:220px;left:-80px;bottom:80px;background:#ff8c28}
.stars{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 1px);background-size:75px 75px,125px 125px;background-position:10px 20px,40px 60px}
.game{position:relative;z-index:2;width:min(560px,calc(100% - 24px));min-height:100vh;margin:auto;padding:16px 0 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back-button{width:44px;height:44px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(255,255,255,.045);color:#fff;font-size:22px}
.title{flex:1;text-align:center}.title small{display:block;color:#718099;font-size:10px;margin-bottom:3px}.title strong{font-size:18px}.title strong span{color:#78869d}
.round-badge{min-width:74px;padding:9px 10px;text-align:center;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:rgba(255,255,255,.04)}
.round-badge small{display:block;color:#69768c;font-size:8px}.round-badge strong{font-size:13px}
.score-card{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:13px;border:1px solid rgba(255,255,255,.07);border-radius:20px;background:rgba(255,255,255,.035);box-shadow:0 15px 45px rgba(0,0,0,.18)}
.player-score{display:flex;align-items:center;gap:9px;min-width:0}.player-score.sun{flex-direction:row-reverse;text-align:right}
.avatar{width:42px;height:42px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px}
.moon .avatar{color:#79bdff;background:rgba(55,140,255,.13)}.sun .avatar{color:#ffad4d;background:rgba(255,140,40,.13)}
.player-info{min-width:0}.player-info small{display:block;color:#69768b;font-size:9px}.player-info strong{display:block;margin-top:2px;font-size:14px}.score-number{margin-top:3px;font-size:19px;font-weight:900}
.versus{text-align:center;color:#68758a}.versus small{display:block;font-size:8px}.versus strong{font-size:11px;color:#a2adbf}
.my-player{margin-top:10px;padding:9px 12px;border-radius:13px;text-align:center;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);color:#8996aa;font-size:10px}.my-player strong{color:#fff}
.status-card{margin-top:14px;padding:17px;text-align:center;border:1px solid rgba(255,255,255,.07);border-radius:20px;background:linear-gradient(135deg,rgba(25,45,82,.72),rgba(8,14,29,.85));transition:.25s}
.status-card.your-turn{border-color:rgba(80,160,255,.25)}.status-icon{width:54px;height:54px;margin:0 auto 9px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(255,255,255,.045)}.status-card.your-turn .status-icon{animation:pulse 1.5s infinite}
.status-title{font-size:17px;font-weight:900}.status-subtitle{margin-top:4px;color:#7d8aa0;font-size:10px}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(90,170,255,0)}}
.board-wrap{margin-top:16px;padding:13px;border:1px solid rgba(255,255,255,.07);border-radius:25px;background:rgba(4,9,20,.72);box-shadow:0 25px 70px rgba(0,0,0,.25)}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cell{border:1px solid rgba(255,255,255,.07);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(42px,14vw,74px);font-weight:900;transition:.18s}
.cell:not(.taken):not(:disabled):hover{transform:translateY(-2px);border-color:rgba(110,180,255,.22)}.cell:disabled{cursor:not-allowed}
.cell.moon-mark{color:#78c0ff;text-shadow:0 0 22px rgba(70,160,255,.45);animation:markIn .28s}.cell.sun-mark{color:#ffad4d;text-shadow:0 0 22px rgba(255,145,40,.4);animation:markIn .28s}
@keyframes markIn{0%{opacity:0;transform:scale(.35)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.cell.winner{animation:winnerCell .7s infinite alternate}@keyframes winnerCell{to{box-shadow:0 0 30px rgba(255,190,70,.32)}}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.control-button{min-height:48px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.045);color:#dfe6f2;font-weight:700}.control-button.primary{background:linear-gradient(135deg,#1763b7,#2e86df);border-color:transparent}
.tip{margin-top:13px;padding:12px;text-align:center;color:#69768b;font-size:9px;line-height:1.7}
.result-overlay{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,5,12,.78);backdrop-filter:blur(12px)}
.result-card{width:min(390px,100%);padding:30px 23px 23px;text-align:center;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:linear-gradient(145deg,#152544,#080d1b);box-shadow:0 30px 100px rgba(0,0,0,.55)}
.result-icon{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:45px;background:rgba(255,255,255,.05)}
.result-card h2{margin:0;font-size:26px}.result-card p{margin:9px 0 0;color:#8794a9;font-size:12px;line-height:1.7}
.reward{margin:18px 0;padding:13px;border-radius:15px;background:rgba(255,170,60,.07);border:1px solid rgba(255,170,60,.1);color:#ffb35c;font-weight:900}
.result-actions{display:grid;gap:9px}.result-actions button{min-height:49px;border:0;border-radius:15px;color:#fff;font-weight:800}
.play-again{background:linear-gradient(135deg,#1763b7,#3286df)}.close-result{background:rgba(255,255,255,.06)}
.confetti{position:fixed;z-index:150;width:8px;height:13px;top:-20px;pointer-events:none;animation:fall var(--duration) linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}
@media(max-width:390px){.game{width:calc(100% - 16px);padding-top:10px}.score-card{padding:10px}.avatar{width:38px;height:38px}.board-wrap{padding:9px}.board{gap:6px}.cell{border-radius:14px}}
</style>
</head>
<body>
<div class="background"><div class="stars"></div><div class="orb moon-orb"></div><div class="orb sun-orb"></div></div>
<main class="game">
<header class="topbar">
<button class="back-button" onclick="goBack()" aria-label="رجوع">→</button>
<div class="title"><small>مواجهة بدر × شمس</small><strong>إكس أو <span>✦</span></strong></div>
<div class="round-badge"><small>الجولة</small><strong id="roundNumber">1</strong></div>
</header>
<section class="score-card">
<div class="player-score moon"><div class="avatar">☾</div><div class="player-info"><small>اللاعب الأول</small><strong>بدر</strong><div class="score-number" id="baderGameScore">0</div></div></div>
<div class="versus"><small>مواجهة</small><strong>VS</strong></div>
<div class="player-score sun"><div class="avatar">☀</div><div class="player-info"><small>اللاعب الثاني</small><strong>شمس</strong><div class="score-number" id="shamsGameScore">0</div></div></div>
</section>
<div class="my-player">أنت تلعب الآن باسم: <strong id="myPlayerName">جاري التحقق...</strong></div>
<section id="statusCard" class="status-card"><div id="statusIcon" class="status-icon">☾</div><div id="statusTitle" class="status-title">جاري تجهيز الجولة...</div><div id="statusSubtitle" class="status-subtitle">انتظر لحظة</div></section>
<section class="board-wrap"><div id="board" class="board">
<button class="cell" data-index="0" type="button"></button><button class="cell" data-index="1" type="button"></button><button class="cell" data-index="2" type="button"></button>
<button class="cell" data-index="3" type="button"></button><button class="cell" data-index="4" type="button"></button><button class="cell" data-index="5" type="button"></button>
<button class="cell" data-index="6" type="button"></button><button class="cell" data-index="7" type="button"></button><button class="cell" data-index="8" type="button"></button>
</div></section>
<section class="controls"><button class="control-button primary" onclick="restartRound()">🔄 جولة جديدة</button><button class="control-button" onclick="resetMatch()">🧹 تصفير المباراة</button></section>
<div class="tip">✦ كل فوز يمنح اللاعب نقطة واحدة<br>✦ لا يستطيع اللاعب تنفيذ حركة نيابة عن اللاعب الآخر</div>
</main>
<div id="resultOverlay" class="result-overlay hidden"><div class="result-card">
<div id="resultIcon" class="result-icon">🏆</div><h2 id="resultTitle">فوز!</h2><p id="resultText">أحسنت!</p><div id="rewardText" class="reward">+1 نقطة ⭐</div>
<div class="result-actions"><button class="play-again" onclick="restartRound()">🔥 جولة ثانية</button><button class="close-result" onclick="closeResult()">العودة للعبة</button></div>
</div></div>
<script>
"use strict";

const PLAYER={BADER:"bader",SHAMS:"shams"};
const SYMBOL={bader:"☾",shams:"☀"};
const PLAYER_NAME={bader:"بدر",shams:"شمس"};
const WINNING_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board=Array(9).fill(null);
let currentPlayer=PLAYER.BADER;
let myPlayer=null;
let gameOver=false;
let round=1;
let roundStarter=PLAYER.BADER;
let scoreAwarded=false;

let matchScores={bader:0,shams:0};

const cells=[...document.querySelectorAll(".cell")];
const statusCard=document.getElementById("statusCard");
const statusIcon=document.getElementById("statusIcon");
const statusTitle=document.getElementById("statusTitle");
const statusSubtitle=document.getElementById("statusSubtitle");
const myPlayerName=document.getElementById("myPlayerName");
const resultOverlay=document.getElementById("resultOverlay");
const resultIcon=document.getElementById("resultIcon");
const resultTitle=document.getElementById("resultTitle");
const resultText=document.getElementById("resultText");
const rewardText=document.getElementById("rewardText");

const validPlayer=p=>p===PLAYER.BADER||p===PLAYER.SHAMS;
const otherPlayer=p=>p===PLAYER.BADER?PLAYER.SHAMS:PLAYER.BADER;

function getPlayerFromURL(){
    try{
        const p=new URLSearchParams(location.search).get("player");
        return validPlayer(p)?p:null;
    }catch(e){return null}
}

function resolveMyPlayer(){
    if(validPlayer(window.GAME_PLAYER)) return window.GAME_PLAYER;

    const urlPlayer=getPlayerFromURL();
    if(urlPlayer) return urlPlayer;

    try{
        const saved=localStorage.getItem("badrShamsCurrentPlayer");
        if(validPlayer(saved)) return saved;
    }catch(e){}

    return PLAYER.BADER;
}

function setMyPlayer(player){
    if(!validPlayer(player)) return;

    myPlayer=player;

    try{
        localStorage.setItem("badrShamsCurrentPlayer",player);
    }catch(e){}

    myPlayerName.textContent=PLAYER_NAME[player];
    updateStatus();
}

function sendToParent(data){
    try{
        if(window.parent&&window.parent!==window){
            window.parent.postMessage(data,"*");
        }
    }catch(e){}
}

function loadScores(){
    try{
        const saved=localStorage.getItem("badrShamsScores");
        if(saved){
            const parsed=JSON.parse(saved);
            matchScores.bader=Number(parsed.bader??parsed.hammam)||0;
            matchScores.shams=Number(parsed.shams??parsed.monia)||0;
        }
    }catch(e){}

    updateScoreUI();
}

function updateScoreUI(){
    document.getElementById("baderGameScore").textContent=matchScores.bader;
    document.getElementById("shamsGameScore").textContent=matchScores.shams;
}

function saveScores(){
    try{
        localStorage.setItem("badrShamsScores",JSON.stringify({
            bader:matchScores.bader,
            shams:matchScores.shams,
            hammam:matchScores.bader,
            monia:matchScores.shams
        }));
    }catch(e){}
}

function addPoint(player){
    if(!validPlayer(player)||scoreAwarded) return;

    scoreAwarded=true;
    matchScores[player]+=1;
    updateScoreUI();
    saveScores();

    sendToParent({
        type:"SCORE_ADDED",
        player,
        amount:1,
        round
    });
}

function renderCell(index,player){
    const cell=cells[index];

    cell.textContent=SYMBOL[player];
    cell.classList.add("taken",player===PLAYER.BADER?"moon-mark":"sun-mark");
    cell.disabled=true;
}

function renderBoard(){
    cells.forEach(cell=>{
        const index=Number(cell.dataset.index);
        const player=board[index];

        cell.textContent=player?SYMBOL[player]:"";
        cell.classList.remove("taken","moon-mark","sun-mark","winner");

        if(player){
            cell.classList.add("taken",player===PLAYER.BADER?"moon-mark":"sun-mark");
        }
    });

    updateBoardAvailability();
}

function updateBoardAvailability(){
    cells.forEach(cell=>{
        const index=Number(cell.dataset.index);
        cell.disabled=gameOver||board[index]!==null||currentPlayer!==myPlayer;
    });
}

function getWinningLine(){
    for(const line of WINNING_LINES){
        const [a,b,c]=line;
        if(board[a]&&board[a]===board[b]&&board[a]===board[c]) return line;
    }
    return null;
}

function showWaitingMessage(){
    statusIcon.textContent=SYMBOL[currentPlayer];
    statusTitle.textContent=`انتظر دور ${PLAYER_NAME[currentPlayer]}`;
    statusSubtitle.textContent="هذه الجولة ليست حركتك الآن 🔒";
    statusCard.classList.remove("your-turn");
}

function updateStatus(){
    if(!myPlayer) return;

    const isMyTurn=currentPlayer===myPlayer;

    statusIcon.textContent=SYMBOL[currentPlayer];

    if(isMyTurn){
        statusTitle.textContent=`دورك يا ${PLAYER_NAME[myPlayer]}`;
        statusSubtitle.textContent=myPlayer===PLAYER.BADER?"بدر، اختار خانتك 🌙":"شمس، ورّينا الحركة ☀️";
        statusCard.classList.add("your-turn");
    }else{
        statusTitle.textContent=`دور ${PLAYER_NAME[currentPlayer]}`;
        statusSubtitle.textContent=`انتظر ${PLAYER_NAME[currentPlayer]} يكمل حركته`;
        statusCard.classList.remove("your-turn");
    }

    updateBoardAvailability();
}

function playMove(index){
    if(!myPlayer||gameOver||index<0||index>8||board[index]!==null) return;

    if(currentPlayer!==myPlayer){
        showWaitingMessage();
        return;
    }

    board[index]=myPlayer;
    renderCell(index,myPlayer);
    playMoveSound(myPlayer);

    sendToParent({
        type:"XO_MOVE",
        player:myPlayer,
        index,
        round
    });

    afterMove(myPlayer);
}

function applyRemoteMove(player,index,remoteRound){
    if(
        !validPlayer(player)||
        player===myPlayer||
        gameOver||
        Number(remoteRound)!==Number(round)||
        player!==currentPlayer||
        index<0||
        index>8||
        board[index]!==null
    ) return;

    board[index]=player;
    renderCell(index,player);
    playMoveSound(player);
    afterMove(player);
}

function afterMove(player){
    const winningLine=getWinningLine();

    if(winningLine){
        finishWin(player,winningLine);
        return;
    }

    if(board.every(Boolean)){
        finishDraw();
        return;
    }

    currentPlayer=otherPlayer(player);
    updateStatus();

    sendToParent({
        type:"XO_TURN_CHANGED",
        currentPlayer,
        round
    });
}

function finishWin(player,winningLine){
    if(gameOver) return;

    gameOver=true;

    winningLine.forEach(index=>cells[index].classList.add("winner"));

    updateBoardAvailability();
    addPoint(player);

    statusIcon.textContent=SYMBOL[player];
    statusTitle.textContent=`فوز ${PLAYER_NAME[player]}!`;
    statusSubtitle.textContent="الجولة انتهت 🔥";
    statusCard.classList.remove("your-turn");

    resultIcon.textContent=player===PLAYER.BADER?"🌙":"☀️";
    resultTitle.textContent=`البطل: ${PLAYER_NAME[player]}`;
    resultText.textContent=player===PLAYER.BADER
        ?"البدر حسم الجولة! شمس عندها فرصة للرد."
        :"الشمس أشرقت بقوة! البدر يقدر ينتقم في الجولة القادمة.";
    rewardText.textContent=`+1 نقطة لـ ${PLAYER_NAME[player]} ⭐`;

    createConfetti();

    setTimeout(()=>resultOverlay.classList.remove("hidden"),500);
}

function finishDraw(){
    if(gameOver) return;

    gameOver=true;
    updateBoardAvailability();

    statusIcon.textContent="🤝";
    statusTitle.textContent="تعادل!";
    statusSubtitle.textContent="ولا واحد قدر يحسمها 😈";
    statusCard.classList.remove("your-turn");

    resultIcon.textContent="🤝";
    resultTitle.textContent="تعادل!";
    resultText.textContent="الجولة انتهت بدون فائز.";
    rewardText.textContent="بدون نقاط هذه الجولة";

    setTimeout(()=>resultOverlay.classList.remove("hidden"),400);
}

window.restartRound=function(starter=null){
    resultOverlay.classList.add("hidden");

    board=Array(9).fill(null);
    gameOver=false;
    scoreAwarded=false;

    if(validPlayer(starter)){
        roundStarter=starter;
    }else if(validPlayer(myPlayer)){
        roundStarter=myPlayer;
    }

    round++;
    currentPlayer=roundStarter;

    document.getElementById("roundNumber").textContent=round;

    renderBoard();
    updateStatus();

    sendToParent({
        type:"XO_NEW_ROUND",
        round,
        starter:roundStarter
    });
};

window.resetMatch=function(){
    if(!confirm("هل تريد تصفير نقاط بدر وشمس؟")) return;

    matchScores={bader:0,shams:0};
    saveScores();
    updateScoreUI();

    sendToParent({type:"RESET_BADR_SHAMS_SCORES"});

    round=0;
    restartRound(myPlayer||PLAYER.BADER);
};

window.closeResult=function(){
    resultOverlay.classList.add("hidden");
};

window.goBack=function(){
    try{
        if(window.parent&&window.parent!==window&&typeof window.parent.closeGame==="function"){
            window.parent.closeGame();
            return;
        }
    }catch(e){}

    if(history.length>1) history.back();
};

function playMoveSound(player){
    try{
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(!AudioContextClass) return;

        const context=new AudioContextClass();
        const oscillator=context.createOscillator();
        const gain=context.createGain();

        oscillator.type="sine";
        oscillator.frequency.value=player===PLAYER.BADER?520:650;

        gain.gain.setValueAtTime(.0001,context.currentTime);
        gain.gain.exponentialRampToValueAtTime(.07,context.currentTime+.01);
        gain.gain.exponentialRampToValueAtTime(.0001,context.currentTime+.09);

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();
        oscillator.stop(context.currentTime+.1);

        setTimeout(()=>context.close?.(),150);
    }catch(e){}
}

function createConfetti(){
    for(let i=0;i<55;i++){
        const piece=document.createElement("div");
        piece.className="confetti";

        piece.style.right=Math.random()*100+"vw";
        piece.style.setProperty("--x",((Math.random()-.5)*80)+"vw");
        piece.style.setProperty("--duration",(1.5+Math.random()*1.8)+"s");
        piece.style.background=Math.random()>.5?"#ffad4d":"#72baff";

        document.body.appendChild(piece);

        setTimeout(()=>piece.remove(),3500);
    }
}

cells.forEach(cell=>{
    cell.addEventListener("click",()=>playMove(Number(cell.dataset.index)));
});

window.addEventListener("message",event=>{
    const data=event.data;
    if(!data) return;

    if(data.type==="SET_PLAYER_ROLE"){
        setMyPlayer(data.player);
        return;
    }

    if(data.type==="START_XO_ROUND"){
        if(Number.isFinite(Number(data.round))){
            round=Number(data.round);
            document.getElementById("roundNumber").textContent=round;
        }

        if(validPlayer(data.starter)){
            roundStarter=data.starter;
            currentPlayer=data.starter;
        }

        board=Array(9).fill(null);

        if(Array.isArray(data.board)){
            data.board.slice(0,9).forEach((value,index)=>{
                if(validPlayer(value)) board[index]=value;
            });
        }

        scoreAwarded=false;
        gameOver=false;
        resultOverlay.classList.add("hidden");

        renderBoard();
        updateStatus();
        return;
    }

    if(data.type==="XO_REMOTE_MOVE"){
        applyRemoteMove(data.player,Number(data.index),Number(data.round));
        return;
    }

    if(data.type==="XO_SET_TURN"&&validPlayer(data.player)&&!gameOver){
        currentPlayer=data.player;
        updateStatus();
        return;
    }

    if(data.type==="SCORES_UPDATED"){
        loadScores();
        return;
    }

    if(data.type==="XO_RESET_ROUND"){
        restartRound(data.starter);
    }
});

function initGame(){
    myPlayer=resolveMyPlayer();
    myPlayerName.textContent=PLAYER_NAME[myPlayer];

    loadScores();

    currentPlayer=roundStarter;

    renderBoard();
    updateStatus();

    sendToParent({
        type:"XO_REQUEST_PLAYER_ROLE"
    });
}

initGame();
</script>
</body>
</html>
