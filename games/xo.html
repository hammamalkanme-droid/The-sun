<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050916">

    <title>إكس أو | بدر × شمس</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    #1b315e 0%,
                    #091126 42%,
                    #040711 100%
                );
            color: white;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }

        .hidden {
            display: none !important;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(55px);
            opacity: .22;
        }

        .moon-orb {
            width: 240px;
            height: 240px;
            right: -80px;
            top: 80px;
            background: #237ee8;
        }

        .sun-orb {
            width: 220px;
            height: 220px;
            left: -80px;
            bottom: 80px;
            background: #ff8c28;
        }

        .stars {
            position: absolute;
            inset: 0;
            opacity: .55;
            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.7) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    rgba(255,255,255,.35) 1px,
                    transparent 1px
                );
            background-size:
                75px 75px,
                125px 125px;
            background-position:
                10px 20px,
                40px 60px;
        }


        /* =========================================
           MAIN
        ========================================= */

        .game {
            position: relative;
            z-index: 2;
            width: min(560px, calc(100% - 24px));
            min-height: 100vh;
            margin: auto;
            padding: 16px 0 28px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .back-button {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 14px;
            background: rgba(255,255,255,.045);
            color: white;
            font-size: 22px;
            transition: .2s;
        }

        .back-button:hover {
            background: rgba(255,255,255,.08);
        }

        .title {
            flex: 1;
            text-align: center;
        }

        .title small {
            display: block;
            color: #718099;
            font-size: 10px;
            margin-bottom: 3px;
        }

        .title strong {
            font-size: 18px;
        }

        .title strong span {
            color: #78869d;
        }

        .round-badge {
            min-width: 74px;
            padding: 9px 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 13px;
            background: rgba(255,255,255,.04);
        }

        .round-badge small {
            display: block;
            color: #69768c;
            font-size: 8px;
        }

        .round-badge strong {
            font-size: 13px;
        }


        /* =========================================
           SCORE
        ========================================= */

        .score-card {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            padding: 13px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 20px;
            background: rgba(255,255,255,.035);
            box-shadow:
                0 15px 45px rgba(0,0,0,.18),
                inset 0 1px 0 rgba(255,255,255,.025);
        }

        .player-score {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .player-score.sun {
            flex-direction: row-reverse;
            text-align: right;
        }

        .avatar {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .moon .avatar {
            color: #79bdff;
            background: rgba(55,140,255,.13);
            box-shadow:
                0 0 25px rgba(55,140,255,.08);
        }

        .sun .avatar {
            color: #ffad4d;
            background: rgba(255,140,40,.13);
            box-shadow:
                0 0 25px rgba(255,140,40,.08);
        }

        .player-info {
            min-width: 0;
        }

        .player-info small {
            display: block;
            color: #69768b;
            font-size: 9px;
        }

        .player-info strong {
            display: block;
            margin-top: 2px;
            font-size: 14px;
        }

        .score-number {
            margin-top: 3px;
            font-size: 19px;
            font-weight: 900;
        }

        .versus {
            text-align: center;
            color: #68758a;
        }

        .versus small {
            display: block;
            font-size: 8px;
        }

        .versus strong {
            font-size: 11px;
            color: #a2adbf;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status-card {
            margin-top: 14px;
            padding: 17px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 20px;
            background:
                linear-gradient(
                    135deg,
                    rgba(25,45,82,.72),
                    rgba(8,14,29,.85)
                );
        }

        .status-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 9px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(255,255,255,.045);
            transition: .3s;
        }

        .status-card.your-turn .status-icon {
            animation: pulse 1.5s infinite;
        }

        .status-title {
            font-size: 17px;
            font-weight: 900;
        }

        .status-subtitle {
            margin-top: 4px;
            color: #7d8aa0;
            font-size: 10px;
        }

        @keyframes pulse {
            0%,100% {
                box-shadow: 0 0 0 0 rgba(90,170,255,.15);
            }

            50% {
                box-shadow: 0 0 0 12px rgba(90,170,255,0);
            }
        }


        /* =========================================
           BOARD
        ========================================= */

        .board-wrap {
            margin-top: 16px;
            padding: 13px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 25px;
            background:
                rgba(4,9,20,.72);
            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        .board {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
        }

        .cell {
            position: relative;
            min-width: 0;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 18px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(42px, 14vw, 74px);
            font-weight: 900;
            transition:
                transform .18s,
                background .18s,
                border .18s,
                box-shadow .18s;
            overflow: hidden;
        }

        .cell:not(.taken):hover {
            transform: translateY(-2px);
            background:
                linear-gradient(
                    145deg,
                    rgba(70,150,255,.09),
                    rgba(255,255,255,.025)
                );
            border-color: rgba(110,180,255,.22);
        }

        .cell:disabled {
            cursor: default;
        }

        .cell.moon-mark {
            color: #78c0ff;
            text-shadow:
                0 0 22px rgba(70,160,255,.45);
            animation: markIn .28s ease-out;
        }

        .cell.sun-mark {
            color: #ffad4d;
            text-shadow:
                0 0 22px rgba(255,145,40,.4);
            animation: markIn .28s ease-out;
        }

        @keyframes markIn {
            0% {
                opacity: 0;
                transform: scale(.35) rotate(-12deg);
            }

            70% {
                transform: scale(1.12) rotate(2deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .cell.winner {
            animation:
                winnerCell .7s infinite alternate;
            z-index: 2;
        }

        @keyframes winnerCell {
            from {
                box-shadow:
                    0 0 10px rgba(255,255,255,.08);
            }

            to {
                box-shadow:
                    0 0 30px rgba(255,190,70,.32),
                    inset 0 0 20px rgba(255,190,70,.06);
            }
        }


        /* =========================================
           CONTROLS
        ========================================= */

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 13px;
        }

        .control-button {
            min-height: 48px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            background: rgba(255,255,255,.045);
            color: #dfe6f2;
            font-weight: 700;
            transition: .2s;
        }

        .control-button:hover {
            border-color: rgba(255,255,255,.16);
            background: rgba(255,255,255,.07);
        }

        .control-button.primary {
            background:
                linear-gradient(
                    135deg,
                    #1763b7,
                    #2e86df
                );
            border-color: transparent;
            box-shadow:
                0 12px 30px rgba(35,120,230,.18);
        }


        /* =========================================
           TIP
        ========================================= */

        .tip {
            margin-top: 13px;
            padding: 12px;
            text-align: center;
            color: #69768b;
            font-size: 9px;
            line-height: 1.7;
        }


        /* =========================================
           RESULT OVERLAY
        ========================================= */

        .result-overlay {
            position: fixed;
            z-index: 100;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                rgba(2,5,12,.78);
            backdrop-filter: blur(12px);
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .result-card {
            width: min(390px, 100%);
            padding: 30px 23px 23px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 28px;
            background:
                linear-gradient(
                    145deg,
                    #152544,
                    #080d1b
                );
            box-shadow:
                0 30px 100px rgba(0,0,0,.55);
            animation: resultPop .35s ease-out;
        }

        @keyframes resultPop {
            from {
                transform: scale(.8) translateY(20px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .result-icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 14px;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            background: rgba(255,255,255,.05);
        }

        .result-card h2 {
            margin: 0;
            font-size: 26px;
        }

        .result-card p {
            margin: 9px 0 0;
            color: #8794a9;
            font-size: 12px;
            line-height: 1.7;
        }

        .reward {
            margin: 18px 0;
            padding: 13px;
            border-radius: 15px;
            background: rgba(255,170,60,.07);
            border: 1px solid rgba(255,170,60,.1);
            color: #ffb35c;
            font-weight: 900;
        }

        .result-actions {
            display: grid;
            gap: 9px;
        }

        .result-actions button {
            min-height: 49px;
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 800;
        }

        .play-again {
            background:
                linear-gradient(
                    135deg,
                    #1763b7,
                    #3286df
                );
        }

        .close-result {
            background: rgba(255,255,255,.06);
        }


        /* =========================================
           CONFETTI
        ========================================= */

        .confetti {
            position: fixed;
            z-index: 150;
            width: 8px;
            height: 13px;
            top: -20px;
            pointer-events: none;
            animation:
                confettiFall
                var(--duration)
                linear
                forwards;
        }

        @keyframes confettiFall {
            to {
                transform:
                    translate3d(
                        var(--x),
                        110vh,
                        0
                    )
                    rotate(720deg);
                opacity: 0;
            }
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 390px) {

            .game {
                width: min(100% - 16px, 560px);
                padding-top: 10px;
            }

            .score-card {
                padding: 10px;
            }

            .avatar {
                width: 38px;
                height: 38px;
            }

            .board-wrap {
                padding: 9px;
            }

            .board {
                gap: 6px;
            }

            .cell {
                border-radius: 14px;
            }

        }

    </style>

</head>


<body>


<div class="background">
    <div class="stars"></div>
    <div class="orb moon-orb"></div>
    <div class="orb sun-orb"></div>
</div>


<main class="game">

    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="topbar">

        <button
            type="button"
            class="back-button"
            onclick="goBack()"
            aria-label="رجوع"
        >
            →
        </button>


        <div class="title">

            <small>
                مواجهة بدر × شمس
            </small>

            <strong>
                إكس أو
                <span>✦</span>
            </strong>

        </div>


        <div class="round-badge">

            <small>
                الجولة
            </small>

            <strong id="roundNumber">
                1
            </strong>

        </div>

    </header>


    <!-- =========================================
         SCORE
    ========================================== -->

    <section class="score-card">

        <div class="player-score moon">

            <div class="avatar">
                ☾
            </div>

            <div class="player-info">

                <small>
                    اللاعب الأول
                </small>

                <strong>
                    بدر
                </strong>

                <div
                    class="score-number"
                    id="baderGameScore"
                >
                    0
                </div>

            </div>

        </div>


        <div class="versus">

            <small>
                مواجهة
            </small>

            <strong>
                VS
            </strong>

        </div>


        <div class="player-score sun">

            <div class="avatar">
                ☀
            </div>

            <div class="player-info">

                <small>
                    اللاعب الثاني
                </small>

                <strong>
                    شمس
                </strong>

                <div
                    class="score-number"
                    id="shamsGameScore"
                >
                    0
                </div>

            </div>

        </div>

    </section>


    <!-- =========================================
         STATUS
    ========================================== -->

    <section
        id="statusCard"
        class="status-card your-turn"
    >

        <div
            id="statusIcon"
            class="status-icon"
        >
            ☾
        </div>

        <div
            id="statusTitle"
            class="status-title"
        >
            دور بدر
        </div>

        <div
            id="statusSubtitle"
            class="status-subtitle"
        >
            اختار خانتك وابدأ الهجوم
        </div>

    </section>


    <!-- =========================================
         BOARD
    ========================================== -->

    <section class="board-wrap">

        <div
            id="board"
            class="board"
        >

            <button
                type="button"
                class="cell"
                data-index="0"
                aria-label="الخانة 1"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="1"
                aria-label="الخانة 2"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="2"
                aria-label="الخانة 3"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="3"
                aria-label="الخانة 4"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="4"
                aria-label="الخانة 5"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="5"
                aria-label="الخانة 6"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="6"
                aria-label="الخانة 7"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="7"
                aria-label="الخانة 8"
            ></button>

            <button
                type="button"
                class="cell"
                data-index="8"
                aria-label="الخانة 9"
            ></button>

        </div>

    </section>


    <!-- =========================================
         CONTROLS
    ========================================== -->

    <section class="controls">

        <button
            type="button"
            class="control-button primary"
            onclick="restartRound()"
        >
            🔄 جولة جديدة
        </button>

        <button
            type="button"
            class="control-button"
            onclick="resetMatch()"
        >
            🧹 تصفير المباراة
        </button>

    </section>


    <div class="tip">
        ✦ كل فوز يمنح اللاعب نقطة واحدة
        <br>
        ✦ المباراة تستمر بين بدر وشمس حتى تقرروا التوقف
    </div>

</main>


<!-- =========================================
     RESULT
========================================== -->

<div
    id="resultOverlay"
    class="result-overlay hidden"
>

    <div class="result-card">

        <div
            id="resultIcon"
            class="result-icon"
        >
            🏆
        </div>

        <h2 id="resultTitle">
            فوز!
        </h2>

        <p id="resultText">
            أحسنت!
        </p>

        <div
            id="rewardText"
            class="reward"
        >
            +1 نقطة ⭐
        </div>

        <div class="result-actions">

            <button
                type="button"
                class="play-again"
                onclick="restartRound()"
            >
                🔥 جولة ثانية
            </button>

            <button
                type="button"
                class="close-result"
                onclick="closeResult()"
            >
                العودة للعبة
            </button>

        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   إعدادات اللعبة
========================================================= */

const PLAYER = {

    MOON: "hammam",

    SUN: "monia"

};


const SYMBOL = {

    [PLAYER.MOON]: "☾",

    [PLAYER.SUN]: "☀"

};


const PLAYER_NAME = {

    [PLAYER.MOON]: "بدر",

    [PLAYER.SUN]: "شمس"

};


const WINNING_LINES = [

    [0, 1, 2],

    [3, 4, 5],

    [6, 7, 8],

    [0, 3, 6],

    [1, 4, 7],

    [2, 5, 8],

    [0, 4, 8],

    [2, 4, 6]

];


/* =========================================================
   حالة اللعبة
========================================================= */

let board = [

    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null

];

let currentPlayer = PLAYER.MOON;

let gameOver = false;

let round = 1;


/*
    نقاط المباراة الخاصة باللعبة.
    نحاول أولاً قراءة النقاط من index.html.
*/

let matchScores = {

    hammam: 0,

    monia: 0

};


/* =========================================================
   العناصر
========================================================= */

const cells =
    Array.from(
        document.querySelectorAll(".cell")
    );

const statusCard =
    document.getElementById("statusCard");

const statusIcon =
    document.getElementById("statusIcon");

const statusTitle =
    document.getElementById("statusTitle");

const statusSubtitle =
    document.getElementById("statusSubtitle");

const resultOverlay =
    document.getElementById("resultOverlay");

const resultIcon =
    document.getElementById("resultIcon");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");

const rewardText =
    document.getElementById("rewardText");



/* =========================================================
   قراءة النقاط من الصفحة الأساسية
========================================================= */

function loadScores() {

    try {

        /*
            الصفحة الأساسية تحتفظ بالنقاط في localStorage
            باسم badrShamsScores.
        */

        const saved =
            localStorage.getItem(
                "badrShamsScores"
            );


        if (saved) {

            const parsed =
                JSON.parse(saved);


            matchScores.hammam =
                Number(parsed.hammam) || 0;


            matchScores.monia =
                Number(parsed.monia) || 0;

        }

    } catch (error) {

        console.log(
            "تعذر قراءة النقاط",
            error
        );

    }


    updateScoreUI();

}


/* =========================================================
   تحديث النقاط
========================================================= */

function updateScoreUI() {

    document.getElementById(
        "baderGameScore"
    ).textContent =
        matchScores.hammam;


    document.getElementById(
        "shamsGameScore"
    ).textContent =
        matchScores.monia;

}


/* =========================================================
   إضافة نقطة للاعب
========================================================= */

function addPoint(player) {

    /*
        أهم جزء للتكامل مع index.html.

        إذا كانت اللعبة مفتوحة داخل iframe،
        نستعمل parent.addPoints().
    */

    try {

        if (
            window.parent &&
            window.parent !== window &&
            typeof window.parent.addPoints === "function"
        ) {

            window.parent.addPoints(
                player,
                1
            );

        }

    } catch (error) {

        console.log(
            "تعذر إرسال النقطة للصفحة الأساسية",
            error
        );

    }


    /*
        نحدّث النقاط محليًا كذلك.
    */

    matchScores[player] =
        (matchScores[player] || 0) + 1;


    updateScoreUI();

}


/* =========================================================
   تشغيل الخلايا
========================================================= */

cells.forEach(cell => {

    cell.addEventListener(
        "click",
        function() {

            playMove(
                Number(
                    this.dataset.index
                )
            );

        }
    );

});


/* =========================================================
   اللعب
========================================================= */

function playMove(index) {

    if (gameOver) {
        return;
    }


    if (board[index] !== null) {
        return;
    }


    /*
        تسجيل الحركة
    */

    board[index] =
        currentPlayer;


    const cell =
        cells[index];


    cell.textContent =
        SYMBOL[currentPlayer];


    cell.classList.add("taken");


    cell.classList.add(
        currentPlayer === PLAYER.MOON
            ? "moon-mark"
            : "sun-mark"
    );


    /*
        صوت خفيف إن كان المتصفح يسمح
    */

    playMoveSound();


    /*
        فحص الفوز
    */

    const winningLine =
        getWinningLine();


    if (winningLine) {

        finishWin(
            currentPlayer,
            winningLine
        );

        return;

    }


    /*
        فحص التعادل
    */

    if (
        board.every(
            value => value !== null
        )
    ) {

        finishDraw();

        return;

    }


    /*
        تبديل الدور
    */

    currentPlayer =
        currentPlayer === PLAYER.MOON
            ? PLAYER.SUN
            : PLAYER.MOON;


    updateStatus();

}


/* =========================================================
   إيجاد الفوز
========================================================= */

function getWinningLine() {

    for (
        const line
        of WINNING_LINES
    ) {

        const [a, b, c] =
            line;


        if (
            board[a] &&
            board[a] === board[b] &&
            board[a] === board[c]
        ) {

            return line;

        }

    }


    return null;

}


/* =========================================================
   الفوز
========================================================= */

function finishWin(
    player,
    winningLine
) {

    gameOver = true;


    winningLine.forEach(index => {

        cells[index]
            .classList
            .add("winner");

    });


    cells.forEach(cell => {

        cell.disabled = true;

    });


    /*
        إضافة النقطة.
    */

    addPoint(player);


    /*
        تحديث الحالة.
    */

    const name =
        PLAYER_NAME[player];


    if (player === PLAYER.MOON) {

        statusIcon.textContent = "☾";

    } else {

        statusIcon.textContent = "☀";

    }


    statusTitle.textContent =
        `فوز ${name}!`;


    statusSubtitle.textContent =
        "يا سلام! الجولة كانت قوية 🔥";


    statusCard.classList.remove(
        "your-turn"
    );


    /*
        النتيجة.
    */

    resultIcon.textContent =
        player === PLAYER.MOON
            ? "🌙"
            : "☀️";


    resultTitle.textContent =
        `البطل: ${name}`;


    resultText.textContent =
        player === PLAYER.MOON
            ? "البدر حسم الجولة! شمس عندها فرصة للرد."
            : "الشمس أشرقت بقوة! البدر لازم ينتقم في الجولة القادمة.";


    rewardText.textContent =
        `+1 نقطة لـ ${name} ⭐`;


    createConfetti();


    setTimeout(() => {

        resultOverlay
            .classList
            .remove("hidden");

    }, 500);

}


/* =========================================================
   التعادل
========================================================= */

function finishDraw() {

    gameOver = true;


    cells.forEach(cell => {

        cell.disabled = true;

    });


    statusIcon.textContent =
        "🤝";


    statusTitle.textContent =
        "تعادل!" ;


    statusSubtitle.textContent =
        "ولا واحد قدر يحسمها 😈";


    statusCard.classList.remove(
        "your-turn"
    );


    resultIcon.textContent =
        "🤝";


    resultTitle.textContent =
        "تعادل!" ;


    resultText.textContent =
        "الجولة انتهت بدون فائز... نعيدها ونشوف من يحسمها.";


    rewardText.textContent =
        "بدون نقاط هذه الجولة";


    setTimeout(() => {

        resultOverlay
            .classList
            .remove("hidden");

    }, 400);

}


/* =========================================================
   تحديث الدور
========================================================= */

function updateStatus() {

    const isMoon =
        currentPlayer === PLAYER.MOON;


    statusIcon.textContent =
        isMoon
            ? "☾"
            : "☀";


    statusTitle.textContent =
        `دور ${PLAYER_NAME[currentPlayer]}`;


    statusSubtitle.textContent =
        isMoon
            ? "البدر، اختار خانتك 🌙"
            : "شمس، ورّينا الحركة ☀️";


    statusCard.classList.add(
        "your-turn"
    );

}


/* =========================================================
   جولة جديدة
========================================================= */

window.restartRound = function() {

    resultOverlay
        .classList
        .add("hidden");


    board = [

        null,
        null,
        null,
        null,
        null,
        null,
        null,
        null,
        null

    ];


    gameOver = false;


    round++;


    document.getElementById(
        "roundNumber"
    ).textContent =
        round;


    /*
        الفائز السابق يبدأ الجولة التالية؟
        لا.
        نبدّل البداية حتى تكون عادلة.
    */

    currentPlayer =
        round % 2 === 0
            ? PLAYER.SUN
            : PLAYER.MOON;


    cells.forEach(cell => {

        cell.textContent = "";

        cell.disabled = false;

        cell.classList.remove(
            "taken",
            "moon-mark",
            "sun-mark",
            "winner"
        );

    });


    updateStatus();

};


/* =========================================================
   تصفير المباراة
========================================================= */

window.resetMatch = function() {

    const confirmed =
        confirm(
            "هل تريد تصفير نقاط بدر وشمس؟"
        );


    if (!confirmed) {
        return;
    }


    /*
        تصفير النقاط داخل الصفحة الأساسية.
    */

    try {

        localStorage.setItem(
            "badrShamsScores",
            JSON.stringify({
                hammam: 0,
                monia: 0
            })
        );


        if (
            window.parent &&
            window.parent !== window
        ) {

            /*
                نعيد قراءة النقاط من الصفحة الأساسية
                عن طريق دالة addPoints لا تصلح للتصفير،
                لذلك نرسل حدثًا مخصصًا.
            */

            window.parent.postMessage(
                {
                    type:
                        "RESET_BADR_SHAMS_SCORES"
                },
                "*"
            );

        }

    } catch (error) {

        console.log(error);

    }


    matchScores.hammam = 0;

    matchScores.monia = 0;


    updateScoreUI();


    restartRound();

};


/* =========================================================
   إغلاق النتيجة
========================================================= */

window.closeResult = function() {

    resultOverlay
        .classList
        .add("hidden");

};


/* =========================================================
   الرجوع للصفحة الأساسية
========================================================= */

window.goBack = function() {

    /*
        إذا كانت اللعبة داخل iframe،
        نطلب من الصفحة الأساسية إغلاق اللعبة.
    */

    try {

        if (
            window.parent &&
            window.parent !== window &&
            typeof window.parent.closeGame === "function"
        ) {

            window.parent.closeGame();

            return;

        }

    } catch (error) {

        console.log(error);

    }


    /*
        احتياط إذا فتحت xo.html مباشرة.
    */

    if (history.length > 1) {

        history.back();

    }

};


/* =========================================================
   مؤثرات الحركة
========================================================= */

function playMoveSound() {

    /*
        صوت Web Audio بسيط جدًا.
        لا يحتاج أي ملف خارجي.
    */

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            currentPlayer === PLAYER.MOON
                ? 520
                : 650;


        gain.gain.setValueAtTime(
            0.0001,
            context.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.07,
            context.currentTime + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            context.currentTime + 0.09
        );


        oscillator.connect(gain);

        gain.connect(context.destination);


        oscillator.start();

        oscillator.stop(
            context.currentTime + 0.1
        );

    } catch (error) {

        /*
            إذا رفض المتصفح الصوت،
            اللعبة تستمر طبيعي.
        */

    }

}


/* =========================================================
   احتفال الفوز
========================================================= */

function createConfetti() {

    const pieces = 55;


    for (
        let i = 0;
        i < pieces;
        i++
    ) {

        const piece =
            document.createElement("div");


        piece.className =
            "confetti";


        piece.style.right =
            Math.random() * 100 + "vw";


        piece.style.setProperty(
            "--x",
            (
                (Math.random() - .5) *
                80
            ) + "vw"
        );


        piece.style.setProperty(
            "--duration",
            (
                1.5 +
                Math.random() * 1.8
            ) + "s"
        );


        piece.style.background =
            Math.random() > .5
                ? "#ffad4d"
                : "#72baff";


        piece.style.transform =
            `rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(
            piece
        );


        setTimeout(() => {

            piece.remove();

        }, 3500);

    }

}


/* =========================================================
   استقبال رسائل الصفحة الأساسية
========================================================= */

window.addEventListener(
    "message",
    function(event) {

        if (
            event.data &&
            event.data.type ===
            "SCORES_UPDATED"
        ) {

            loadScores();

        }

    }
);


/* =========================================================
   تشغيل اللعبة
========================================================= */

loadScores();

updateStatus();


console.log(
    "🌙☀️ إكس أو — بدر × شمس جاهزة!"
);

</script>
