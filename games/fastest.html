<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الأسرع — بدر × شمس</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:#050916;color:#fff}body{padding:16px}
.wrap{width:min(620px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.top a{color:#82c5ff;text-decoration:none}.card{margin-top:14px;padding:22px;border:1px solid #ffffff12;border-radius:25px;background:linear-gradient(145deg,#142444,#080d1b);box-shadow:0 25px 80px #0008}.code{text-align:center;color:#728097;font-size:11px}.code b{color:#fff;font-size:17px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.p{padding:12px;text-align:center;border-radius:15px;background:#ffffff07}.p strong,.p span{display:block}.p span{font-size:10px;color:#718098;margin-top:4px}.score{display:flex;justify-content:space-between;margin-top:12px;padding:12px;border-radius:14px;background:#ffffff06}.arena{margin-top:14px;min-height:350px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.state{color:#8190a8;font-size:13px;line-height:1.7;min-height:45px}.reaction{width:min(300px,80vw);height:min(300px,80vw);border-radius:50%;border:0;background:radial-gradient(circle,#243d6d,#101a31);box-shadow:0 0 70px #2b74d433;transition:.08s;color:#fff;font-size:28px;font-weight:900}.reaction.wait{background:radial-gradient(circle,#222d45,#0b1120)}.reaction.go{background:radial-gradient(circle,#2acb72,#0d5a37);box-shadow:0 0 90px #2acb7266;transform:scale(1.03)}.reaction.bad{background:radial-gradient(circle,#d34f61,#591e2b)}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#1f70c9;color:#fff;font-weight:800;margin-top:14px}.small{font-size:10px;color:#647289;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h2>⚡ الأسرع</h2><a href="../index.html">← الغرفة</a></div>
<div class="card">
<div class="code">غرفة <b id="roomCode">------</b></div>
<div class="players"><div class="p">☾ <strong id="meName">...</strong><span id="meStatus">متصل</span></div><div class="p">☀ <strong id="otherName">...</strong><span id="otherStatus">متصل</span></div></div>
<div class="score"><span>☾ بدر: <b id="scoreA">0</b></span><span>☀ شمس: <b id="scoreB">0</b></span></div>
<div class="arena">
<div id="state" class="state">جاري ربط الهاتفين...</div>
<button id="reaction" class="reaction wait" disabled>استعد</button>
<button id="start" class="btn" onclick="requestStart()">ابدأ الجولة</button>
<div class="small">لا تضغط إلا عندما تصبح الدائرة خضراء. أول ضغطة صحيحة تفوز.</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const URL="https://vslatdxtvfjeftoljxc.supabase.co";
const KEY="sb_publishable_bxZkAQifpNf7yHYo_HuM-w_fUafg_Y2";
const PLAYERS={"1250493517":{name:"بدر",icon:"☾"},"8187108979":{name:"شمس",icon:"☀"}};
const sb=supabase.createClient(URL,KEY);
let meId=null,room=null,ch=null,timer=null,round=0,active=false,goAt=0,localPressed=false;

function getId(){
 try{const tg=window.Telegram?.WebApp;if(tg){tg.ready();const u=tg.initDataUnsafe?.user;if(u?.id)return String(u.id)}}catch(e){}
 return new URLSearchParams(location.search).get("user_id");
}
async function load(){
 meId=getId(); const code=new URLSearchParams(location.search).get("room");
 if(!meId||!PLAYERS[meId]||!code){$("state").textContent="تعذر معرفة اللاعب أو الغرفة.";return}
 $("meName").textContent=PLAYERS[meId].icon+" "+PLAYERS[meId].name;
 $("roomCode").textContent=code;
 const {data,error}=await sb.from("game_rooms").select("*").eq("code",code).maybeSingle();
 if(error||!data){$("state").textContent="الغرفة غير موجودة.";return}
 room=data;
 const other=String(room.host_id)===meId?room.guest_id:room.host_id;
 $("otherName").textContent=other&&PLAYERS[String(other)] ? PLAYERS[String(other)].icon+" "+PLAYERS[String(other)].name : "في الانتظار";
 render(room);
 subscribe();
}
function $(x){return document.getElementById(x)}
function render(r){
 const s=r.state||{};const scores=s.scores||{};
 $("scoreA").textContent=Number(scores["1250493517"])||0;
 $("scoreB").textContent=Number(scores["8187108979"])||0;
 if(s.game!=="fastest"){return}
 if(s.phase==="go" && s.round===round){active=true;goAt=Number(s.goAt)||Date.now();$("reaction").disabled=false;$("reaction").className="reaction go";$("reaction").textContent="اضغط!";$("state").textContent="الآن! ⚡"}
 else if(s.phase==="round" && s.round!==round){round=s.round;active=false;localPressed=false;$("reaction").disabled=false;$("reaction").className="reaction wait";$("reaction").textContent="استعد";$("state").textContent="الجولة بدأت… لا تضغط قبل الأخضر";scheduleGo(Number(s.goAt)||Date.now()+1200)}
 else if(s.phase==="result"){$("reaction").disabled=true;$("reaction").className="reaction wait";$("reaction").textContent="🏆";$("state").textContent=s.winner===meId?"فزت بالجولة! 🎉":s.winner==="false-start"?"انطلقت قبل الوقت ❌":"شمس أسرع هذه الجولة ⚡"}
}
function subscribe(){
 ch=sb.channel("fastest-"+room.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"game_rooms",filter:"id=eq."+room.id},p=>{room=p.new;render(room)}).subscribe();
}
function scheduleGo(ts){
 clearTimeout(timer);const delay=Math.max(100,ts-Date.now());
 timer=setTimeout(async()=>{ 
   if(!room)return;
   const state={...(room.state||{}),phase:"go",goAt:Date.now(),round:round};
   await sb.from("game_rooms").update({state}).eq("id",room.id);
 },delay);
}
async function requestStart(){
 if(!room?.guest_id){$("state").textContent="استنى اللاعب الثاني يدخل الغرفة.";return}
 const next=(Number(room.state?.round)||0)+1;
 const goAt=Date.now()+1800+Math.floor(Math.random()*2600);
 const state={...(room.state||{}),game:"fastest",phase:"round",round:next,goAt};
 round=next;active=false;localPressed=false;
 $("reaction").disabled=false;$("reaction").className="reaction wait";$("reaction").textContent="استعد";$("state").textContent="استعد…";
 await sb.from("game_rooms").update({game:"fastest",state}).eq("id",room.id);
}
async function press(){
 if(localPressed)return;
 localPressed=true;
 if(!active){
   clearTimeout(timer);
   const state={...(room.state||{}),phase:"result",winner:"false-start",round};
   await sb.from("game_rooms").update({state}).eq("id",room.id);
   $("reaction").className="reaction bad";$("reaction").textContent="❌";$("state").textContent="ضغطت بدري!";
   return;
 }
 const ms=Math.max(0,Date.now()-goAt);
 const current=room.state||{};
 if(current.phase!=="go"||current.round!==round)return;
 const state={...current,phase:"result",winner:meId,winnerMs:ms};
 const scores={...(current.scores||{})};
 scores[meId]=(Number(scores[meId])||0)+1;
 state.scores=scores;
 await sb.from("game_rooms").update({state}).eq("id",room.id);
 $("state").textContent="رد فعلك: "+ms+"ms ⚡";
}
$("reaction").addEventListener("click",press);
window.addEventListener("load",load);
</script>
</body>
</html>
