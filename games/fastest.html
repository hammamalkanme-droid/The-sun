<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>الأسرع — بدر × شمس</title>

<style>

*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
font-family:Segoe UI,Tahoma,Arial,sans-serif;
background:#050916;
color:#fff
}

body{padding:16px}

.wrap{
width:min(620px,100%);
margin:auto
}

.top{
display:flex;
align-items:center;
justify-content:space-between
}

.top a{
color:#82c5ff;
text-decoration:none
}

.card{
margin-top:14px;
padding:22px;
border:1px solid #ffffff12;
border-radius:25px;
background:linear-gradient(145deg,#142444,#080d1b);
box-shadow:0 25px 80px #0008
}

.code{
text-align:center;
color:#728097;
font-size:11px
}

.code b{
color:#fff;
font-size:17px
}

.players{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px
}

.p{
padding:12px;
text-align:center;
border-radius:15px;
background:#ffffff07
}

.p strong,.p span{
display:block
}

.p span{
font-size:10px;
color:#718098;
margin-top:4px
}

.score{
display:flex;
justify-content:space-between;
margin-top:12px;
padding:12px;
border-radius:14px;
background:#ffffff06
}

.arena{
margin-top:14px;
min-height:350px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center
}

.state{
color:#8190a8;
font-size:13px;
line-height:1.7;
min-height:45px
}

.reaction{
width:min(300px,80vw);
height:min(300px,80vw);
border-radius:50%;
border:0;
background:radial-gradient(circle,#243d6d,#101a31);
box-shadow:0 0 70px #2b74d433;
transition:.08s;
color:#fff;
font-size:28px;
font-weight:900
}

.reaction.wait{
background:radial-gradient(circle,#222d45,#0b1120)
}

.reaction.go{
background:radial-gradient(circle,#2acb72,#0d5a37);
box-shadow:0 0 90px #2acb7266;
transform:scale(1.03)
}

.reaction.bad{
background:radial-gradient(circle,#d34f61,#591e2b)
}

.btn{
width:100%;
border:0;
border-radius:14px;
padding:14px;
background:#1f70c9;
color:#fff;
font-weight:800;
margin-top:14px
}

.small{
font-size:10px;
color:#647289;
text-align:center;
margin-top:12px
}

.hidden{
display:none!important
}

</style>

</head>

<body>

<div class="wrap">

<div class="top">

<h2>⚡ الأسرع</h2>

<a href="../index.html">
← الغرفة
</a>

</div>


<div class="card">

<div class="code">
غرفة <b id="roomCode">------</b>
</div>


<div class="players">

<div class="p">
☾
<strong id="meName">...</strong>
<span id="meStatus">متصل</span>
</div>

<div class="p">
☀
<strong id="otherName">...</strong>
<span id="otherStatus">متصل</span>
</div>

</div>


<div class="score">

<span>
☾ بدر:
<b id="scoreA">0</b>
</span>

<span>
☀ شمس:
<b id="scoreB">0</b>
</span>

</div>


<div class="arena">

<div id="state" class="state">
جاري ربط الهاتفين...
</div>


<button
id="reaction"
class="reaction wait"
disabled>
استعد
</button>


<button
id="start"
class="btn"
onclick="requestStart()">
ابدأ الجولة
</button>


<div class="small">
لا تضغط إلا عندما تصبح الدائرة خضراء.
أول ضغطة صحيحة تفوز.
</div>

</div>

</div>

</div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


const SUPABASE_URL =
"https://vslatdxtvfjeftoljxc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_bxZkAQifpNf7yHYo_HuM-w_fUafg_Y2";


const PLAYERS = {

"1250493517":{
name:"بدر",
icon:"☾"
},

"8187108979":{
name:"شمس",
icon:"☀"
}

};


const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let meId = null;
let room = null;
let ch = null;

let timer = null;
let round = 0;
let active = false;
let goAt = 0;
let localPressed = false;


function $(x){
return document.getElementById(x);
}


function getId(){

try{

const tg =
window.Telegram &&
window.Telegram.WebApp;

if(tg){

tg.ready();

try{
tg.expand();
}catch(e){}

const u =
tg.initDataUnsafe &&
tg.initDataUnsafe.user;

if(u && u.id)
return String(u.id);

}

}catch(e){}


const urlId =
new URLSearchParams(location.search)
.get("user_id");

return urlId
? String(urlId)
: null;

}


async function load(){

meId = getId();


const code =
new URLSearchParams(location.search)
.get("room");


if(
!meId ||
!PLAYERS[meId] ||
!code
){

$("state").textContent =
"تعذر معرفة اللاعب أو الغرفة.";

return;

}


$("meName").textContent =
PLAYERS[meId].icon +
" " +
PLAYERS[meId].name;


$("roomCode").textContent =
code;


const {data,error} =
await sb
.from("game_rooms")
.select("*")
.eq("code",code)
.maybeSingle();


if(error || !data){

$("state").textContent =
"الغرفة غير موجودة.";

return;

}


room = data;


const other =
String(room.host_id) === meId
? room.guest_id
: room.host_id;


$("otherName").textContent =
other &&
PLAYERS[String(other)]
?
PLAYERS[String(other)].icon+
" "+
PLAYERS[String(other)].name
:
"في الانتظار";


render(room);

subscribe();

}


function render(r){

const s =
r.state || {};

const scores =
s.scores || {};


$("scoreA").textContent =
Number(scores["1250493517"]) || 0;


$("scoreB").textContent =
Number(scores["8187108979"]) || 0;


if(s.game !== "fastest")
return;


/*
الجولة الجديدة:
نستعمل goAt الموجود في قاعدة البيانات
بدل ما نخلي كل هاتف يغير القاعدة بنفسه.
*/

if(
s.phase === "round" &&
Number(s.round) !== round
){

round =
Number(s.round);

active = false;

localPressed = false;

$("reaction").disabled = false;

$("reaction").className =
"reaction wait";

$("reaction").textContent =
"استعد";

$("state").textContent =
"استعد… لا تضغط قبل الأخضر";


scheduleGo(
Number(s.goAt)
);

return;

}


/*
إذا وصلنا لحالة الأخضر
*/

if(
s.phase === "go" &&
Number(s.round) === round
){

active = true;

goAt =
Number(s.goAt) || Date.now();

$("reaction").disabled = false;

$("reaction").className =
"reaction go";

$("reaction").textContent =
"اضغط!";

$("state").textContent =
"الآن! ⚡";

return;

}


/*
النتيجة
*/

if(
s.phase === "result" &&
Number(s.round) === round
){

clearTimeout(timer);

active = false;

$("reaction").disabled = true;

if(s.winner === "false-start"){

$("reaction").className =
"reaction bad";

$("reaction").textContent =
"❌";

$("state").textContent =
s.falseStarter === meId
?
"ضغطت بدري! ❌"
:
"الخصم ضغط بدري! 🎉";

}else{

$("reaction").className =
"reaction wait";

$("reaction").textContent =
"🏆";

if(s.winner === meId){

$("state").textContent =
"فزت بالجولة! 🎉";

}else{

const ms =
Number(s.winnerMs) || 0;

$("state").textContent =
"الخصم أسرع بـ "+ms+"ms ⚡";

}

}

}

}


/*
كل هاتف يحوّل الدائرة للأخضر محلياً
في نفس الوقت المحدد من السيرفر.
*/

function scheduleGo(ts){

clearTimeout(timer);

if(!ts)
return;


const delay =
Math.max(0,ts-Date.now());


timer =
setTimeout(()=>{

if(!room)
return;


const current =
room.state || {};


if(
current.phase !== "round" ||
Number(current.round) !== round
)
return;


active = true;

goAt =
Number(current.goAt) || Date.now();


$("reaction").disabled = false;

$("reaction").className =
"reaction go";

$("reaction").textContent =
"اضغط!";

$("state").textContent =
"الآن! ⚡";

},delay);

}


/*
البداية تكون من المنشئ فقط
حتى ما يضغط اللاعبان "ابدأ الجولة"
في نفس اللحظة.
*/

async function requestStart(){

if(!room?.guest_id){

$("state").textContent =
"استنى اللاعب الثاني يدخل الغرفة.";

return;

}


if(String(room.host_id) !== meId){

$("state").textContent =
"بدر هو اللي يبدأ الجولة.";

return;

}


/*
لا تبدأ جولة جديدة إذا كانت جولة حالياً.
*/

const current =
room.state || {};

if(
current.phase === "round" ||
current.phase === "go"
){

$("state").textContent =
"الجولة الحالية ما زالت شغالة.";

return;

}


const next =
(Number(current.round) || 0) + 1;


/*
وقت عشوائي بين 1.8 و4.4 ثانية
*/

const goAt =
Date.now() +
1800 +
Math.floor(
Math.random()*2600
);


const state = {

...current,

game:"fastest",

phase:"round",

round:next,

goAt,

winner:null,

winnerMs:null,

falseStarter:null

};


round = next;

active = false;

localPressed = false;


$("reaction").disabled = false;

$("reaction").className =
"reaction wait";

$("reaction").textContent =
"استعد";

$("state").textContent =
"استعد…";


const {data,error} =
await sb
.from("game_rooms")
.update({
game:"fastest",
state
})
.eq("id",room.id)
.select()
.single();


if(error){

$("state").textContent =
"حدث خطأ في بدء الجولة.";

return;

}


/*
مهم جداً:
نشغّل مؤقت الهاتف الذي بدأ الجولة أيضاً.
*/

room = data;

scheduleGo(goAt);

}


/*
الضغط قبل الأخضر:
تحديث ذري، وأول واحد فقط ينجح.
*/

async function falseStart(){

if(localPressed)
return;

localPressed = true;

clearTimeout(timer);

const current =
room.state || {};


const state = {

...current,

phase:"result",

winner:"false-start",

falseStarter:meId

};


const {data,error} =
await sb
.from("game_rooms")
.update({
state
})
.eq("id",room.id)
.eq("state->>phase","round")
.eq("state->>round",String(round))
.select()
.maybeSingle();


if(data){

room = data;

active = false;

$("reaction").disabled = true;

$("reaction").className =
"reaction bad";

$("reaction").textContent =
"❌";

$("state").textContent =
"ضغطت بدري! ❌";

}else{

/*
لاعب آخر حسم الجولة قبلك.
*/

localPressed = false;

}

}


/*
الضغط الصحيح:
نستعمل شرط phase=go
حتى أول تحديث فقط ينجح.
*/

async function press(){

if(localPressed)
return;


if(!active){

await falseStart();

return;

}


localPressed = true;


const current =
room.state || {};


if(
current.phase !== "go" ||
Number(current.round) !== round
){

localPressed = false;

return;

}


const ms =
Math.max(
0,
Date.now() -
(Number(current.goAt) || goAt)
);


const scores = {
...(current.scores || {})
};


scores[meId] =
(Number(scores[meId]) || 0) + 1;


const state = {

...current,

phase:"result",

winner:meId,

winnerMs:ms,

scores

};


/*
هذا الشرط هو المهم:
إذا بدر وشمس ضغطوا تقريباً في نفس اللحظة،
أول UPDATE يحوّل phase من go إلى result،
والثاني لن يجد phase=go وبالتالي لن يفوز.
*/

const {data,error} =
await sb
.from("game_rooms")
.update({
state
})
.eq("id",room.id)
.eq("state->>phase","go")
.eq("state->>round",String(round))
.select()
.maybeSingle();


if(data){

room = data;

active = false;

clearTimeout(timer);

$("reaction").disabled = true;

$("reaction").className =
"reaction wait";

$("reaction").textContent =
"🏆";

$("state").textContent =
"رد فعلك: "+ms+"ms ⚡";

}else{

/*
الخصم سبقك بجزء من الثانية.
*/

localPressed = false;

active = false;

$("reaction").disabled = true;

$("reaction").className =
"reaction bad";

$("reaction").textContent =
"⚡";

$("state").textContent =
"الخصم كان أسرع!";

}

}


/*
Realtime
*/

function subscribe(){

if(ch)
sb.removeChannel(ch);


ch =
sb
.channel("fastest-"+room.id)

.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"game_rooms",
filter:"id=eq."+room.id
},
p=>{

room = p.new;

render(room);

}
)

.subscribe();

}


$("reaction")
.addEventListener(
"click",
press
);


window.addEventListener(
"load",
load
);

</script>

</body>
</html>
